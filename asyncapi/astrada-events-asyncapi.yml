asyncapi: 2.6.0
info:
  title: Astrada Webhook Events
  version: '2024-02-28'
  description: Webhook event surface for the Astrada API, generated from the documented Event Types and webhook delivery mechanics.
    Astrada delivers events via HTTP POST to registered HTTPS endpoints with at-least-once semantics and HMAC-SHA256 signing.
  contact:
    email: developer@astrada.co
x-provenance:
  generated: '2026-07-18'
  method: searched
  source: https://docs.astrada.co/reference/event-types
  delivery_docs: https://docs.astrada.co/docs/webhooks-1
defaultContentType: application/json
servers:
  webhook:
    url: https://your-registered-endpoint
    protocol: https
    description: Consumer-registered HTTPS endpoint (created via POST /webhooks).
channels:
  transactionmessage.created:
    subscribe:
      summary: A new Transaction Message was registered in Astrada.
      message:
        $ref: '#/components/messages/transactionmessage_created'
  transaction.created:
    subscribe:
      summary: A new Transaction was created.
      message:
        $ref: '#/components/messages/transaction_created'
  transaction.updated:
    subscribe:
      summary: A Transaction was updated.
      message:
        $ref: '#/components/messages/transaction_updated'
  transaction.match.created:
    subscribe:
      summary: A transaction match (card-to-bank reconciliation) was created.
      message:
        $ref: '#/components/messages/transaction_match_created'
  transaction.match.deleted:
    subscribe:
      summary: A transaction match was deleted.
      message:
        $ref: '#/components/messages/transaction_match_deleted'
  banklink.completed:
    subscribe:
      summary: A bank-link enrollment completed; bank accounts discovered.
      message:
        $ref: '#/components/messages/banklink_completed'
  banktransaction.created:
    subscribe:
      summary: A new bank transaction was created.
      message:
        $ref: '#/components/messages/banktransaction_created'
  banktransaction.deleted:
    subscribe:
      summary: A bank transaction was deleted.
      message:
        $ref: '#/components/messages/banktransaction_deleted'
  cardsubscription.created:
    subscribe:
      summary: A card subscription (enrolled card) was created.
      message:
        $ref: '#/components/messages/cardsubscription_created'
  cardsubscription.updated:
    subscribe:
      summary: A card subscription was updated.
      message:
        $ref: '#/components/messages/cardsubscription_updated'
  enrichment.merchant.created:
    subscribe:
      summary: A merchant enrichment record was created.
      message:
        $ref: '#/components/messages/enrichment_merchant_created'
