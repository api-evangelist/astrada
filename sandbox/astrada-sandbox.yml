enrollment_restriction:
  note: >-
    In the dedicated sandbox environment, POST /card-subscriptions accepts ONLY published
    test cards; any other PAN is rejected up front with a typed 403
    (errorCode card_subscription.sandbox_card_not_allowed) before any network call.
mastercard_note: >-
  Mastercard test cards are served by an in-process emulator; the live network is never
  called and the 3DS challenge is simulated (advance via POST /steps/challenge).
