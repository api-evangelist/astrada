                              - USA
                              - CAN
                              blockedCardTypes: []
                              blockedFundingCardTypes:
                              - DEBIT
                            bulk-enrollment:
                              countries:
                              - USA
                              - CAN
                              blockedCardTypes: []
                              blockedFundingCardTypes: []
                          MASTERCARD:
                            countries:
                            - USA
                            single-enrollment:
                              countries:
                              - USA
                              blockedCardTypes:
                              - CONSUMER
                              blockedFundingCardTypes: []
                            bulk-enrollment:
                              countries:
                              - USA
                              blockedCardTypes: []
                              blockedFundingCardTypes: []
                Example no Subaccounts found:
                  value:
                    _links:
                      self:
                        href: /subaccounts
                    _embedded:
                      subaccounts: []
        '400':
          $ref: '#/components/responses/bad-request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
