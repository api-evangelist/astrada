  messageTraits:
    astradaWebhook:
      headers:
        type: object
        properties:
          webhook-event-type:
            type: string
            description: The event type name.
          webhook-subaccount-id:
            type: string
            description: Subaccount the event relates to.
          webhook-id:
            type: string
            description: Unique message id, stable across retries.
          webhook-timestamp:
            type: string
            description: Epoch seconds at send time.
          webhook-signature:
            type: string
            description: Base64 HMAC-SHA256 over webhook-id, webhook-timestamp and raw body joined by a full stop.
