    enrollment-policy:
      type: object
      description: 'Enrollment policy for an account or subaccount. Two groups of fields:


        **Unified-SDK rails** (`cardEnrollment`, `bankEnrollment`, `bulkEnrollment`) — which

        enrollment options the unified SDK renders. Customer-writable per subaccount via

        `PATCH /subaccounts/{subaccountId}`; account-level defaults are admin-managed. Rails

        resolve live per field (subaccount value if set, else account) and reads are SPARSE:

        only explicitly-configured rail fields are returned — an absent field means "not

        configured here" and the SDK falls back to the host page''s client configuration, then

        its card-only default.


        **Admin fields** (`spinwheelEnabled`, `programBins`) — whether the Spinwheel enrollment

        option is offered, and which card-program BINs identify the customer''s program.

        Managed only on the internal enrollment-policy endpoints.


        Fields are optional and nullable; absent fields leave the current value unchanged, explicit

        `null` clears a field.

        '
      properties:
        spinwheelEnabled:
          type: boolean
          nullable: true
          description: 'Master gate for offering Spinwheel enrollment. Absent / `null` / `false` → disabled.


            Resolution: the account-level value is the master switch. A subaccount''s stored value only

            takes effect while the account''s is also `true` — subaccount GETs return this **effective**

            value, not the stored one. Disabling at the account level is non-destructive: stored

            subaccount values are unchanged, so re-enabling the account automatically restores

            subaccounts whose stored value is `true`.


            Setting `true` on a subaccount while the parent account''s gate is off is rejected with

            `400` (no escalation past the account).

            '
        bulkEnrollmentEnabled:
          type: boolean
          nullable: true
          deprecated: true
          description: '**Deprecated:** superseded by the `bulkEnrollment` tri-state rail (the SDK maps

            `true` to `suggested`, `false` to `off`, and prefers the tri-state when present).


            Whether the unified enrollment SDK offers bulk-enrollment steering (BIN eligibility

            check + bulk feed wizard) for this account/subaccount. `false` = the SDK skips the

            eligibility check entirely and opens the card form directly (American Express cards

            pivot to the bank-linking flow). Absent / `null` = not configured — the SDK falls

            back to the host page''s client configuration, then its card-only default (bulk off).


            Resolution: plain override-fallback — a subaccount value overrides the account value

            when set (no master gate; unlike `spinwheelEnabled`). An explicit `bulkEnrollment`

            flag in the SDK''s `open()` config wins over this policy.

            '
        cardEnrollment:
          type: boolean
          nullable: true
          description: 'Unified-SDK rail: offer manual card enrollment (PAN entry + 3DS verification).

            Resolution: live per-field override-fallback (subaccount value if set, else account).

            '
        bankEnrollment:
          type: string
          nullable: true
          enum:
          - 'off'
          - amex-only
          - 'on'
          description: 'Unified-SDK rail: offer bank linking. `on` = first-class (chooser tile, any-order

            linking); `amex-only` = reachable only via the American Express pivot from card

            entry; `off` = disabled. Resolution: live per-field override-fallback.

            '
        bulkEnrollment:
          type: string
          nullable: true
          enum:
          - 'off'
          - suggested
          - forced
          description: 'Unified-SDK rail: offer network bulk-feed enrollment for bulk-capable programs.

            `suggested` = bulk wizard with a link-just-this-card escape; `forced` = the wizard

            is the only path for bulk-capable cards; `off` = no bulk routing (direct card

            form). Supersedes the deprecated `bulkEnrollmentEnabled` boolean; when both are

            set, the SDK prefers this field. Resolution: live per-field override-fallback.

            '
        programBins:
          type: array
          nullable: true
          items:
            type: string
            pattern: ^\d{6,8}$
          description: 'The customer''s card-program BIN prefixes (tier-2 manual registry), used to match cards to

            the program during enrollment-option resolution. 6–8 digit numeric strings — both legacy

            6-digit and ISO 8-digit prefixes are accepted. Managed via customer onboarding; returned

            as stored on the subaccount (not resolved against the account).

            '
    create-subaccount-configurations:
      type: object
      additionalProperties: false
      description: 'Subaccount network and regional configurations which determine the available networks and geographies during card enrollment.


        The `countries` property for each network accepts either:

        - An array of ISO 3166 alpha-3 country codes (e.g. `["USA", "CAN"]`)

        - The string `"*"` to inherit all countries from the parent account''s capabilities for that network


        When `"*"` is used, the subaccount automatically reflects the parent account''s current country list. If the parent account''s capabilities change, subaccounts using `"*"` will inherit the updated countries. API responses always return the resolved country list, never the `"*"` literal.


        The single and bulk enrollment configurations are not required when creating a subaccount, but if not provided they will default to the same country list as the main countries property for that network. The supported card types for single and bulk enrollment is CONSUMER, while the supported funding card types is DEBIT. If not provided, the block rules for both card types will default to the parent account''s default block rule for that network and enrollment level.


        To set the default rule on the parent account, please reach out to your account manager or support.

        '
      properties:
        VISA:
          type: object
          additionalProperties: false
          properties:
            countries:
              oneOf:
              - type: array
                description: List of contracted regional areas for Visa
                uniqueItems: true
                items:
                  type: string
                  enum:
                  - USA
                  - CAN
                  - IRL
                  - DEU
                  - CZE
                  - SWE
                  - NLD
                  - LTU
                  - GBR
                  - SVN
                  - LUX
                  - POL
                  - SVK
                  - HUN
                  - ITA
                  - ROU
                  - FIN
                  - DNK
                  - MLT
                  - LVA
                  - GRC
                  - AUT
                  - HRV
                  - CHE
                  - NOR
                  - ISL
                  - FRA
                  - ESP
                  - ISR
                  - SMR
                  - VAT
                  - AND
                  - GIB
                  - AUS
                  - NZL
                  - PRT
                  - BEL
                  description: Country Code following ISO 3166 alpha-3
              - type: string
                enum:
                - '*'
                description: 'Wildcard value that inherits all countries from the parent account''s VISA capabilities.

                  '
            single-enrollment:
              type: object
              additionalProperties: false
              properties:
                blockedCardTypes:
                  type: array
                  description: Card types blocked for Visa single enrollment
                  uniqueItems: true
                  items:
                    type: string
                    enum:
                    - CONSUMER
                blockedFundingCardTypes:
                  type: array
                  description: Funding card types blocked for Visa single enrollment
                  uniqueItems: true
                  items:
                    type: string
                    enum:
                    - DEBIT
            bulk-enrollment:
              type: object
              additionalProperties: false
              properties:
                blockedCardTypes:
                  type: array
                  description: Card types blocked for Visa bulk enrollment
                  uniqueItems: true
                  items:
                    type: string
                    enum:
                    - CONSUMER
                blockedFundingCardTypes:
                  type: array
                  description: Funding card types blocked for Visa bulk enrollment
                  uniqueItems: true
                  items:
                    type: string
                    enum:
                    - DEBIT
          required:
          - countries
        MASTERCARD:
          type: object
          additionalProperties: false
          properties:
            countries:
              oneOf:
              - type: array
                description: List of contracted regional areas for Mastercard
                uniqueItems: true
                items:
                  type: string
                  enum:
                  - USA
                  - CAN
                  - GBR
                  - IRL
                  - SWE
                  - DEU
                  - NLD
                  - DNK
                  - ITA
                  - POL
                  - FIN
                  - BEL
                  - ESP
                  - FRA
                  - PRT
                  - AUT
                  - GRC
                  - MLT
                  - NOR
                  - CHE
                  - ISR
                  - AUS
                  - NZL
                  description: Country Code following ISO 3166 alpha-3
              - type: string
                enum:
                - '*'
                description: 'Wildcard value that inherits all countries from the parent account''s MASTERCARD capabilities.

                  '
            single-enrollment:
              type: object
              additionalProperties: false
              properties:
                blockedCardTypes:
                  type: array
                  description: Card types blocked for Mastercard single enrollment
                  uniqueItems: true
                  items:
                    type: string
                    enum:
                    - CONSUMER
                blockedFundingCardTypes:
                  type: array
                  description: Funding card types blocked for Mastercard single enrollment
                  uniqueItems: true
                  items:
                    type: string
                    enum:
                    - DEBIT
            bulk-enrollment:
              type: object
              additionalProperties: false
              properties:
                blockedCardTypes:
                  type: array
                  description: Card types blocked for Mastercard bulk enrollment
                  uniqueItems: true
                  items:
                    type: string
                    enum:
                    - CONSUMER
                blockedFundingCardTypes:
                  type: array
                  description: Funding card types blocked for Mastercard bulk enrollment
                  uniqueItems: true
                  items:
                    type: string
                    enum:
                    - DEBIT
          required:
          - countries
        AMEX:
          type: object
          additionalProperties: false
          properties:
            countries:
              oneOf:
              - type: array
                description: List of contracted regional areas for American Express
                uniqueItems: true
                items:
                  type: string
                  enum:
                  - USA
                  - CAN
                  - GBR
                  - ITA
                  - SWE
                  - AUS
                  - NZL
                  description: Country Code following ISO 3166 alpha-3
              - type: string
                enum:
                - '*'
                description: 'Wildcard value that inherits all countries from the parent account''s AMEX capabilities.

                  '
            single-enrollment:
              type: object
              additionalProperties: false
              properties:
                blockedCardTypes:
                  type: array
                  description: Card types blocked for AMEX single enrollment
                  uniqueItems: true
                  items:
                    type: string
                    enum:
                    - CONSUMER
                blockedFundingCardTypes:
                  type: array
                  description: Funding card types blocked for AMEX single enrollment
                  uniqueItems: true
                  items:
                    type: string
                    enum:
                    - DEBIT
            bulk-enrollment:
              type: object
              additionalProperties: false
              properties:
                blockedCardTypes:
                  type: array
                  description: Card types blocked for AMEX bulk enrollment
                  uniqueItems: true
                  items:
                    type: string
                    enum:
                    - CONSUMER
                blockedFundingCardTypes:
                  type: array
                  description: Funding card types blocked for AMEX bulk enrollment
                  uniqueItems: true
                  items:
                    type: string
                    enum:
                    - DEBIT
          required:
          - countries
      example:
        VISA:
          countries:
          - USA
          - CAN
          single-enrollment:
            blockedCardTypes:
            - CONSUMER
            blockedFundingCardTypes:
            - DEBIT
          bulk-enrollment:
            blockedCardTypes:
            - CONSUMER
            blockedFundingCardTypes:
            - DEBIT
        MASTERCARD:
          countries:
          - USA
          single-enrollment:
            blockedCardTypes:
            - CONSUMER
            blockedFundingCardTypes:
            - DEBIT
          bulk-enrollment:
            blockedCardTypes:
            - CONSUMER
            blockedFundingCardTypes:
            - DEBIT
        AMEX:
          countries:
          - ITA
          single-enrollment:
            blockedCardTypes:
            - CONSUMER
            blockedFundingCardTypes:
            - DEBIT
          bulk-enrollment:
            blockedCardTypes:
            - CONSUMER
            blockedFundingCardTypes:
            - DEBIT
    subaccount:
      type: object
      properties:
        _links:
          type: object
          required:
          - self
          properties:
            self:
              $ref: '#/components/schemas/link'
        accountId:
          type: string
          format: uuid
          description: The unique identifier of the account related to this entity.
        id:
          type: string
          format: uuid
          description: The unique identifier of this subaccount entity.
        name:
          type: string
          description: The name of this subaccount entity.
        createdAt:
          type: string
          format: date-time
          description: Date and time when this resource was created, in UTC, following ISO 8601 format.
        updatedAt:
          type: string
          format: date-time
          description: Date and time when this resource was last updated, in UTC, following ISO 8601 format.
        configurations:
          $ref: '#/components/schemas/subaccount-configuration'
        verificationPolicy:
          $ref: '#/components/schemas/verification-policy'
          nullable: true
          description: Admin-managed card verification policy for this subaccount. Overrides the parent account's policy when set. `null` or absent means no subaccount-level override.
        enrollmentPolicy:
          type: object
          nullable: true
          description: 'Enrollment policy. On reads, fields are the EFFECTIVE values: `spinwheelEnabled`

            is the stored subaccount value resolved against the parent account''s master switch

            (false when either side is off); the unified-SDK rails (`cardEnrollment`,

            `bankEnrollment`, `bulkEnrollment`) and the deprecated `bulkEnrollmentEnabled`

            resolve as subaccount-overrides-account, and are SPARSE — only

            explicitly-configured fields appear; `programBins` is returned as stored. `null`

            means the subaccount stores no policy and no RAIL is set at the account level

            (account-level admin fields are create-time snapshots, so they do not surface

            through a `null` here).

            '
          allOf:
          - $ref: '#/components/schemas/enrollment-policy'
        bankLinkingPolicy:
          $ref: '#/components/schemas/bank-linking-policy'
          nullable: true
          description: 'Admin-managed bank-linking policy. On reads, fields are the EFFECTIVE values —

            per-field live resolution against the parent account (subaccount field if set,

            else account, else `null`). A whole-`null` policy means neither level has one

            set. The credit-only system default (`accountTypes: [credit]`) is applied

            downstream at bank-link creation, not materialized in this read.

            '
      required:
      - _links
      - accountId
      - id
      - name
      - createdAt
      - updatedAt
      - configurations
    verification-policy:
      type: object
      description: 'Admin-managed overrides controlling how card verification is performed for an account or subaccount.

        Fields are optional and nullable; absent fields leave the current value unchanged, explicit `null` clears an override.

        '
      properties:
        stripeValidationLevel:
          type: string
          nullable: true
          enum:
          - HIGHEST
          - HIGH
          - MEDIUM
          - LOW
          description: "Routes card verifications through Stripe at the specified risk tier when set.\n`null` (or absent) routes through the default TokenEx/IXOPAY (Visa) or TNS (Mastercard) path.\n\nTiers (increasing strictness):\n  * `LOW` — internal-only; 3DS engaged only when risk/regulation requires it; issuer-unsupported\n    soft declines are tolerated. Cannot be self-assigned via this endpoint.\n  * `MEDIUM` — 3DS always requested (challenge preferred); the standard tier to opt into.\n  * `HIGH` — 3DS plus a transient authorization hold (no settled charge) and added fraud signals.\n  * `HIGHEST` — 3DS challenge; if the issuer approves frictionlessly, a two-hold confirmation\n    becomes a mandatory second factor. See the \"HIGHEST Verification\" guide.\n\nNetwork note: Visa uses Stripe at every set tier; Mastercard uses its network 3DS at all tiers and\nengages Stripe only at `HIGHEST` (for the two-hold second factor).\n\nResolution: the subaccount value is operative at request time; the account-level value is the\ninheritance source applied when a subaccount is created, not a live fallback.\n"
        sandbox:
          type: boolean
          nullable: true
          description: 'Test flag, settable by the customer via `PATCH /subaccounts` (and internally via the

            verification-policy endpoints). When `true`, card verifications on this subaccount route KNOWN

            test PANs through the Stripe/TNS sandbox (real cards still go live), and new bank links are

            created against Plaid Sandbox (Plaid test fixtures only — real bank credentials require the

            flag off), so an integrator can deterministically test against a provisioned subaccount.

            Absent / `null` / `false` → live processing only.

            '
        failedAttemptLockout:
          type: boolean
          nullable: true
          description: 'When `true`, ENFORCE the cross-network attempt lockout for this tenant: a card with too many recent

            hard verification failures is refused at create (`400` `verification.attempts_locked`) before any

            provider is called. Account-level fallback (set once for all partner subaccounts), overridable per

            subaccount. Absent / `null` / `false` → not enforced (failures are still recorded; only enforcement

            is gated).

            '
    customer-enrollment-policy:
      type: object
      description: 'The customer-writable subset of the enrollment policy: the three unified-SDK

        rails. All other fields (`spinwheelEnabled`, `programBins`, and the

        deprecated `bulkEnrollmentEnabled`) are managed on the internal

        enrollment-policy endpoints and are ignored if sent here.


        Fields are optional and nullable; absent fields leave the current value

        unchanged, explicit `null` clears the subaccount-level value. A cleared

        rail falls back to the account-level value when one is set; only when

        neither level sets the rail does it disappear from reads, letting the

        host page''s client configuration and then the SDK''s card-only default

        apply.

        '
      properties:
        cardEnrollment:
          type: boolean
          nullable: true
          description: 'Whether the unified SDK offers manual card enrollment (PAN entry + 3DS

            verification).

            '
        bankEnrollment:
          type: string
          nullable: true
          enum:
          - 'off'
          - amex-only
          - 'on'
          description: 'Whether the unified SDK offers bank linking. `on` shows the bank option

            first-class (chooser tile, any-order linking); `amex-only` keeps it

            reachable only via the American Express pivot from card entry; `off`

            disables it (American Express cards then can''t enroll unless a bulk

            program qualifies).

            '
        bulkEnrollment:
          type: string
          nullable: true
          enum:
          - 'off'
          - suggested
          - forced
          description: 'Whether the unified SDK offers network bulk-feed enrollment for

            bulk-capable programs. `suggested` offers the bulk wizard with a

            link-just-this-card escape; `forced` makes the wizard the only path for

            bulk-capable cards; `off` skips bulk routing entirely (direct card

            form).

            '
    link:
      type: object
      properties:
        href:
          type: string
        templated:
          type: boolean
        type:
          type: string
        deprecation:
          type: string
        name:
          type: string
        profile:
          type: string
        title:
          type: string
        hreflang:
          type: string
      required:
      - href
    bank-linking-policy:
      type: object
      description: 'Admin-managed policy controlling which account types and institutions are offered when

        linking bank accounts via the hosted (Plaid) flow. Fields are optional and nullable;

        absent fields leave the current value unchanged, explicit `null` clears a field.


        Resolution is per-field and LIVE: a subaccount field applies when set; when absent/`null`

        the parent account''s value applies; when neither is set the field reads `null` and the

        system default is applied downstream at bank-link creation

        (`accountTypes: [credit]` — credit-card accounts only, the historical behavior).

        Subaccount GETs return these EFFECTIVE resolved values (nulls included — the default is

        never materialized in reads).

        '
      properties:
        accountTypes:
          type: array
          nullable: true
          minItems: 1
          items:
            type: string
            enum:
            - checking
            - savings
            - credit
          description: 'Account types selectable during bank linking. Enforced by the provider at link-token

            creation (Plaid account_filters: checking/savings → depository subtypes, credit →

            credit card); institutions offering none of the allowed types are hidden from

            institution search. Default: `[credit]`.

            '
        pinnedInstitutionId:
          type: string
          nullable: true
          pattern: ^ins_[A-Za-z0-9]+$
          description: 'Provider institution id to pre-select at link creation (e.g. `ins_10` for American

            Express). NOTE: Plaid''s `institution_id` pre-selection is currently rejected on

            production (`INVALID_INSTITUTION`) — this field is stored and forwarded only behind a

            provider capability flag; until the provider supports it, institution limiting is

            achieved with `plaidLinkCustomizationName` plus account-type filtering.

            '
        plaidLinkCustomizationName:
          type: string
          nullable: true
          maxLength: 256
          description: 'Name of a Plaid Dashboard Link customization to pin on created link tokens

            (institution shortlist, Account Select mode). The customization must already exist in

            the Plaid Dashboard — unknown names fail link creation outright. Never

            client-suppliable; applied via this policy only.

            '
  responses:
    not-found:
      description: The requested resource was not found on the server
      content:
        application/problem+json:
          schema:
            type: object
            properties:
              type:
                type: string
              instance:
                type: string
              detail:
                type: string
              title:
                type: string
                enum:
                - Not Found
            required:
            - detail
            - title
          example:
            title: Not Found
            detail: The requested resource was not found on the server.
    unauthorized:
      description: Authentication credentials were either missing or incorrect
      content:
        application/problem+json:
          schema:
            type: object
            properties:
              detail:
                type: string
              title:
                type: string
                enum:
                - Unauthorized
            required:
            - detail
            - title
          example:
            title: Unauthorized
            detail: Authentication credentials were either missing or incorrect.
    forbidden:
      description: Authentication credentials used do not have have permissions to perform the request
      content:
        application/problem+json:
          schema:
            type: object
            properties:
              detail:
                type: string
              title:
                type: string
                enum:
                - Forbidden
            required:
            - detail
            - title
          example:
            title: Forbidden
            detail: You do not have permission to access the requested resource.
    server-error:
      description: The server encountered an unexpected condition that prevented it from fulfilling the request
      content:
        application/problem+json:
          schema:
            type: object
            properties:
              detail:
                type: string
              title:
                type: string
                enum:
                - Internal Server Error
            required:
            - detail
            - title
          example:
            title: Internal Server Error
            detail: The server encountered an unexpected condition that prevented it from fulfilling the request.
    bad-request:
      description: The server cannot or will not process the request due to something that is perceived to be a client error
      content:
        application/problem+json:
          schema:
            type: object
            properties:
              detail:
                type: string
              title:
                type: string
                enum:
                - Bad Request
              errors:
                type: array
                items:
                  type: object
                  properties:
                    title:
                      type: string
                    detail:
                      type: string
                  required:
                  - title
                  - detail
            required:
            - detail
            - title
          examples:
            Example Generic Bad Request Payload Response:
              value:
                title: Bad Request
                detail: Request object failed validation.
            Example Generic Bad Request Parameters Response:
              value:
                title: Bad Request
                detail: Request parameters are invalid.
