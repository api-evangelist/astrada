generated: '2026-07-18'
method: searched
source: https://docs.astrada.co/docs/sandbox-testing
note: >-
  Astrada sandbox testing is enabled per subaccount (verificationPolicy.sandbox: true)
  against the PRODUCTION API, or via a dedicated sandbox environment/subaccount. Known
  test cards route to a verification sandbox for deterministic 3DS outcomes with no real
  money movement. Routing is fail-closed and matches the full PAN exactly (never a BIN/prefix).
enabling:
  mechanism: Set verificationPolicy.sandbox = true on the subaccount via UpdateSubaccount.
  operation: UpdateSubaccount
  scope: Applies to every verification tier, including HIGHEST (two-hold flow runs as test-mode auths).
  guidance: Use a dedicated sandbox subaccount, never a production one.
test_vs_live:
  stripe_publishable_key: Sandbox verifications return a test-mode stripePublishableKey (pk_test_...).
  hold_amounts: sandboxHoldAmounts (amount1/amount2) is returned on the HIGHEST place-holds response in test mode only.
common_settings:
  expiry: Any future expiry, e.g. 12/2034
  cvc: Any 3-digit value, e.g. 123
